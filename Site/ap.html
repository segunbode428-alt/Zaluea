<title>Cruz AP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #0a0f0a;
    --bg-card: #141e14;
    --bg-card-hover: #1a2a1a;
    --border: #2a3d2a;
    --fg: #e0e8e0;
    --fg-dim: #7a8a7a;
    --accent: #e8446c;
    --accent-glow: rgba(232, 68, 108, 0.25);
    --green: #2ecc71;
    --header-bg: #0d130d;
    --slider-track: #2a3d2a;
    --slider-fill: #e8446c;
    --pill-bg: var(--accent);
    --pill-fg: #fff;
    --toggle-off: #3a4a3a;
    --toggle-on: var(--green);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #e8ede8;
    --bg-card: #f4f8f4;
    --bg-card-hover: #eaf0ea;
    --border: #c0ccc0;
    --fg: #1a2a1a;
    --fg-dim: #6a7a6a;
    --header-bg: #dce3dc;
    --slider-track: #c0ccc0;
    --toggle-off: #b0bab0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 0;
    margin: 0;
    min-height: 100vh;
  }

  .panel {
    max-width: 580px;
    margin: 0 auto;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-top: 24px;
    margin-bottom: 24px;
  }

  /* Header */
  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }
  .panel-header .logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .panel-header .title {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--fg);
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--fg-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .zoom-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    width: 22px;
    height: 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-btn:hover { border-color: var(--fg-dim); }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    gap: 6px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tool-btn {
    background: none;
    border: none;
    color: var(--fg-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    cursor: pointer;
    border-radius: 4px;
    white-space: nowrap;
  }
  .tool-btn:hover { color: var(--fg); background: var(--bg-card); }
  .tool-btn.active { color: var(--fg); background: var(--bg-card); }

  .filter-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-dim);
  }
  .filter-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 5px;
    border-radius: 3px;
    background: var(--slider-track);
    outline: none;
  }
  .filter-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent-glow);
  }
  .filter-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--fg);
    min-width: 20px;
    text-align: right;
  }

  /* User list */
  .user-list {
    display: flex;
    flex-direction: column;
  }
  .user-row {
    display: flex;
    align-items: center;
    padding: 12px 18px;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    transition: background 0.15s;
  }
  .user-row:last-child { border-bottom: none; }
  .user-row:hover { background: var(--bg-card-hover); }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a5a3a, #2a4a2a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }

  .user-info {
    flex: 1;
    min-width: 0;
  }
  .user-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-handle {
    font-size: 12px;
    color: var(--fg-dim);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .action-btn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: background 0.15s, transform 0.1s;
    line-height: 1;
  }
  .action-btn:hover {
    background: rgba(255,255,255,0.06);
    transform: scale(1.15);
  }
  .action-btn:active { transform: scale(0.95); }

  .all-btn {
    background: var(--pill-bg);
    color: var(--pill-fg);
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  .all-btn:hover { opacity: 0.85; transform: scale(1.05); }
  .all-btn:active { transform: scale(0.95); }

  /* Toggle */
  .toggle-switch {
    position: relative;
    width: 34px;
    height: 18px;
    flex-shrink: 0;
  }
  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--toggle-off);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle-switch input:checked + .toggle-track {
    background: var(--toggle-on);
  }
  .toggle-switch input:checked + .toggle-track::after {
    transform: translateX(16px);
  }

  /* Responsive */
  @media (max-width: 500px) {
    .panel { margin: 12px 8px; border-radius: 10px; }
    .user-row { padding: 10px 12px; gap: 10px; }
    .actions { gap: 4px; }
    .action-btn { font-size: 15px; padding: 2px; }
    .toolbar { padding: 6px 10px; }
    .avatar { width: 36px; height: 36px; font-size: 17px; }
  }
</style>

<div class="panel">
  <div class="panel-header">
    <div class="logo">👾</div>
    <span class="title">Cruz AP</span>
    <div class="header-right">
      <button class="zoom-btn" onclick="adjustZoom(-1)">−</button>
      <span id="zoomVal">100%</span>
      <button class="zoom-btn" onclick="adjustZoom(1)">+</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool-btn active">Prox</button>
    <button class="tool-btn" id="apToggle" onclick="toggleAP()">Click to AP: <span id="apStatus">OFF</span></button>
    <button class="tool-btn">Spam Base Owner</button>
    <div class="filter-group">
      <span class="filter-label">Filter</span>
      <input type="range" class="filter-slider" min="0" max="100" value="50" oninput="document.getElementById('filterVal').textContent = this.value">
      <span class="filter-value" id="filterVal">50</span>
    </div>
  </div>

  <div class="user-list" id="userList"></div>
</div>

<script>
const users = [
  { name: 'IDKMYUSER646', handle: '@IDKMYUSER646', avatar: '😎' },
  { name: 'CR7', handle: '@adem2014867', avatar: '⚽' },
  { name: 'brzdCqsy9TQUWkTz', handle: '@brzdCqsy9TQUWkTz', avatar: '🎮' },
  { name: 'AURA_ICE', handle: '@youssef_83ie', avatar: '🧊' },
  { name: 'xDarkShadow', handle: '@xDarkShadow99', avatar: '🌑' },
  { name: 'NEON_BLITZ', handle: '@neonblitz_', avatar: '⚡' },
];

const actionEmojis = ['✂️', '🚀', '🔒', '🎈'];

function renderUsers() {
  const list = document.getElementById('userList');
  list.innerHTML = '';
  users.forEach((u, i) => {
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <div class="avatar">${u.avatar}</div>
      <div class="user-info">
        <div class="user-name">${u.name}</div>
        <div class="user-handle">${u.handle}</div>
      </div>
      <div class="actions">
        ${actionEmojis.map(e => `<button class="action-btn" title="${e}">${e}</button>`).join('')}
        <button class="all-btn" onclick="handleAll(${i})">ALL</button>
      </div>
    `;
    list.appendChild(row);
  });
}

let zoom = 100;
function adjustZoom(dir) {
  zoom = Math.max(50, Math.min(200, zoom + dir * 10));
  document.getElementById('zoomVal').textContent = zoom + '%';
}

let apOn = false;
function toggleAP() {
  apOn = !apOn;
  document.getElementById('apStatus').textContent = apOn ? 'ON' : 'OFF';
}

function handleAll(idx) {
  const btns = document.querySelectorAll('.user-row')[idx]?.querySelectorAll('.action-btn');
  btns?.forEach(b => {
    b.style.transform = 'scale(1.3)';
    setTimeout(() => b.style.transform = '', 200);
  });
}

renderUsers();
</script>
